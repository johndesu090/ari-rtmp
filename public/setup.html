<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Setup — Ari RTMP</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-slate-950 text-slate-100 grid place-items-center p-6">
  <div class="w-full max-w-md">
    <div class="flex items-center gap-3 mb-8 justify-center">
      <div class="h-10 w-10 rounded-xl bg-gradient-to-br from-indigo-500 to-fuchsia-500 grid place-items-center font-bold">A</div>
      <span class="font-semibold text-xl">Ari RTMP</span>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8">
      <h1 class="text-2xl font-semibold mb-1">Create administrator</h1>
      <p class="text-sm text-slate-400 mb-6">This wizard runs once, on first launch.</p>

      <form id="setupForm" class="space-y-4">
        <div>
          <label class="block text-sm text-slate-300 mb-1">Username</label>
          <input name="username" required minlength="3" autocomplete="username"
                 class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 outline-none focus:border-indigo-500" />
        </div>
        <div>
          <label class="block text-sm text-slate-300 mb-1">Password <span class="text-slate-500">(min 10 chars)</span></label>
          <input name="password" type="password" required minlength="10" autocomplete="new-password"
                 class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 outline-none focus:border-indigo-500" />
        </div>
        <div>
          <label class="block text-sm text-slate-300 mb-1">Confirm password</label>
          <input name="confirm" type="password" required minlength="10" autocomplete="new-password"
                 class="w-full rounded-lg bg-slate-800 border border-slate-700 px-3 py-2 outline-none focus:border-indigo-500" />
        </div>

        <div id="error" class="hidden text-sm text-red-400 bg-red-950/40 border border-red-900 rounded-lg px-3 py-2"></div>

        <button type="submit" id="submitBtn"
                class="w-full rounded-lg bg-indigo-600 hover:bg-indigo-500 font-medium py-2.5 transition disabled:opacity-50">
          Create account
        </button>
      </form>
    </div>

    <p class="text-center text-sm text-slate-500 mt-6">
      Already configured? <a href="/login.html" class="text-indigo-400 hover:underline">Sign in</a>
    </p>
  </div>

  <script>
    const form = document.getElementById('setupForm');
    const errorEl = document.getElementById('error');
    const btn = document.getElementById('submitBtn');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.remove('hidden');
    }

    (async () => {
      try {
        const res = await fetch('/api/setup/status');
        const { configured } = await res.json();
        if (configured) window.location.replace('/login.html');
      } catch { /* ignore */ }
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');
      const data = new FormData(form);
      const username = data.get('username').trim();
      const password = data.get('password');
      const confirm = data.get('confirm');

      if (password !== confirm) return showError('Passwords do not match.');

      btn.disabled = true;
      btn.textContent = 'Creating…';
      try {
        const res = await fetch('/api/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || 'setup_failed');
        window.location.replace('/login.html');
      } catch (err) {
        showError('Setup failed: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'Create account';
      }
    });
  </script>
</body>
</html>
