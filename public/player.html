<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Ari RTMP Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="/p2p-engine.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #stage { position: relative; width: 100%; height: 100%; background: #000; }
    video {
      width: 100%; height: 100%; object-fit: contain; background: #000; display: block;
    }
    /* Hide the native fullscreen control across engines. */
    video::-webkit-media-controls-fullscreen-button { display: none !important; }
    video::-webkit-media-controls-picture-in-picture-button { display: none !important; }

    /* ── Floating watermark ── */
    #watermark {
      position: absolute;
      top: 8%;
      left: 6%;
      pointer-events: none;
      user-select: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 700;
      font-size: clamp(14px, 3.2vw, 30px);
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.30);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
      mix-blend-mode: screen;
      will-change: transform;
      animation: drift 26s ease-in-out infinite alternate;
      z-index: 5;
    }
    @keyframes drift {
      0%   { transform: translate(0, 0); }
      20%  { transform: translate(52vw, 6vh); }
      40%  { transform: translate(30vw, 62vh); }
      60%  { transform: translate(4vw, 44vh); }
      80%  { transform: translate(58vw, 30vh); }
      100% { transform: translate(12vw, 8vh); }
    }
    /* ── Center play button (simple big triangle; click to start, no autoplay) ── */
    #playButton {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      padding: 0; border: 0; background: none; line-height: 0;
      color: rgba(255, 255, 255, 0.85);
      cursor: pointer; z-index: 10;
      filter: drop-shadow(0 3px 14px rgba(0, 0, 0, 0.7));
      transition: transform 0.12s ease, color 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    #playButton:hover { transform: translate(-50%, -50%) scale(1.08); color: #fff; }
    #playButton.hidden { display: none; }
    #playButton svg { width: 110px; height: 110px; display: block; }

    /* ── Custom controls ──
       The native control bar is disabled so no engine (iOS Safari, Android
       Chrome, desktop Chrome/Edge/Firefox) can offer a fullscreen or
       picture-in-picture button. We ship our own minimal bar instead. */
    #controls {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 12;
      display: flex; align-items: center; gap: 16px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, rgba(0, 0, 0, 0.78), rgba(0, 0, 0, 0));
      opacity: 0; transition: opacity 0.2s ease; pointer-events: none;
    }
    #stage.controls-visible #controls { opacity: 1; pointer-events: auto; }
    #controls button {
      border: 0; background: none; padding: 2px; margin: 0; line-height: 0;
      color: #fff; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    #controls button svg { width: 26px; height: 26px; display: block; }
    #controls .live {
      font: 700 11px/1 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      letter-spacing: 0.14em; color: #fff; background: #dc2626;
      padding: 4px 8px; border-radius: 3px;
    }
    #controls input[type="range"] { width: 96px; accent-color: #818cf8; }

    /* ── Overlay (loading / errors / domain block) ── */
    #overlay {
      position: absolute; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      background: rgba(2, 6, 23, 0.92); color: #e2e8f0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      text-align: center; padding: 24px;
    }
    #overlay.hidden { display: none; }
    #overlay .box { max-width: 460px; }
    #overlay h1 { font-size: 1.05rem; font-weight: 600; margin: 0 0 8px; }
    #overlay p { font-size: 0.85rem; color: #94a3b8; margin: 0; line-height: 1.5; }
    .spinner {
      width: 30px; height: 30px; margin: 0 auto 14px;
      border: 3px solid rgba(148,163,184,0.3); border-top-color: #818cf8;
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="stage">
    <video
      id="video"
      playsinline
      webkit-playsinline
      x5-playsinline
      x5-video-player-type="h5"
      x5-video-player-fullscreen="false"
      disablepictureinpicture
      disableremoteplayback
      controlslist="nodownload nofullscreen noremoteplayback"
      preload="auto"
    ></video>

    <div id="watermark"></div>

    <button id="playButton" aria-label="Play" title="Play">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    </button>

    <div id="controls">
      <button id="btnPlay" aria-label="Play or pause"></button>
      <button id="btnMute" aria-label="Mute or unmute"></button>
      <input id="vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume" />
      <span class="live">LIVE</span>
    </div>

    <div id="overlay">
      <div class="box">
        <div class="spinner" id="spinner"></div>
        <h1 id="overlayTitle">Connecting…</h1>
        <p id="overlayText">Requesting a secure playback token.</p>
      </div>
    </div>
  </div>

  <script>
    'use strict';

    // ── Config ─────────────────────────────────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const STREAM_KEY = params.get('key') || params.get('stream') || '';
    const API_BASE = ''; // same origin

    // ── State ──────────────────────────────────────────────────────────
    let currentToken = null;
    let refreshTimer = null;
    let hls = null;
    let watermarkText = '';
    let destroyed = false;
    let p2p = null;
    let segmentOrigins = []; // [{ url, weight }] — origin + healthy edges
    let sourceUrl = null; // the hls.js manifest URL (without token)

    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const spinner = document.getElementById('spinner');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayText = document.getElementById('overlayText');
    const wm1 = document.getElementById('watermark');
    const playButton = document.getElementById('playButton');

    function showOverlay(title, text, loading = false) {
      overlayTitle.textContent = title;
      overlayText.textContent = text || '';
      spinner.style.display = loading ? 'block' : 'none';
      overlay.classList.remove('hidden');
    }
    function hideOverlay() { overlay.classList.add('hidden'); }

    // ── Center play button (no autoplay) ───────────────────────────────
    function showPlayButton() { playButton.classList.remove('hidden'); }
    function hidePlayButton() { playButton.classList.add('hidden'); }
    playButton.addEventListener('click', () => {
      hidePlayButton();
      video.play().catch(() => showPlayButton());
    });
    video.addEventListener('play', hidePlayButton);
    video.addEventListener('pause', () => {
      // Keep the button hidden when the stream has simply ended.
      if (!video.ended) showPlayButton();
    });

    // ── Custom controls ────────────────────────────────────────────────
    const stage = document.getElementById('stage');
    const btnPlay = document.getElementById('btnPlay');
    const btnMute = document.getElementById('btnMute');
    const vol = document.getElementById('vol');

    const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
    const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';
    const ICON_VOL = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>';
    const ICON_MUTE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm15.5 1.1-1.4-1.4L16 10.8l-2.1-2.1-1.4 1.4L14.6 12l-2.1 2.1 1.4 1.4L16 13.2l2.1 2.1 1.4-1.4L17.4 12z"/></svg>';

    function syncControls() {
      const muted = video.muted || video.volume === 0;
      btnPlay.innerHTML = video.paused ? ICON_PLAY : ICON_PAUSE;
      btnMute.innerHTML = muted ? ICON_MUTE : ICON_VOL;
      vol.value = muted ? '0' : String(video.volume);
    }
    function togglePlay() {
      if (video.paused) video.play().catch(() => showPlayButton());
      else video.pause();
    }
    btnPlay.addEventListener('click', togglePlay);
    btnMute.addEventListener('click', () => { video.muted = !video.muted; syncControls(); });
    vol.addEventListener('input', () => {
      video.volume = Number(vol.value);
      video.muted = video.volume === 0;
      syncControls();
    });
    ['play', 'pause', 'volumechange', 'loadedmetadata'].forEach((evt) => video.addEventListener(evt, syncControls));
    syncControls();

    let hideControlsTimer = null;
    function showControls() {
      stage.classList.add('controls-visible');
      clearTimeout(hideControlsTimer);
      hideControlsTimer = setTimeout(() => stage.classList.remove('controls-visible'), 3200);
    }
    stage.addEventListener('mousemove', showControls);
    stage.addEventListener('touchstart', showControls, { passive: true });
    video.addEventListener('click', () => { showControls(); togglePlay(); });

    // ── Determine the embedding host(s) ────────────────────────────────
    // Collects the referrer and every ancestor origin so the backend can
    // enforce the whitelist. A nested `srcdoc` iframe (e.g. some online
    // editors) makes document.referrer an opaque "about:" URL, so we gather
    // all candidates and let the backend accept any that is whitelisted.
    function detectEmbedHosts() {
      const hosts = [];
      const add = (value) => {
        try {
          const h = new URL(value).hostname;
          if (h && !hosts.includes(h)) hosts.push(h);
        } catch { /* ignore opaque/invalid URLs */ }
      };
      try { if (document.referrer) add(document.referrer); } catch { /* ignore */ }
      try {
        const anc = window.location.ancestorOrigins;
        if (anc) for (let i = 0; i < anc.length; i += 1) add(anc[i]);
      } catch { /* ignore */ }
      if (hosts.length === 0) hosts.push(window.location.hostname);
      return hosts;
    }

    // ── Watermark rendering ────────────────────────────────────────────
    function applyWatermark(text) {
      watermarkText = text;
      wm1.textContent = text;
      // Rotate positions a little so a screenshot always contains the mark.
      const jitter = () => `${(Math.random() * 8 - 4).toFixed(1)}vw`;
      setInterval(() => {
        wm1.style.marginLeft = jitter();
        wm1.style.marginTop = jitter();
      }, 12000);
    }

    // ── Locked-down presentation ───────────────────────────────────────
    // Fullscreen and picture-in-picture are blocked on every engine
    // (iOS/Android Safari + Chrome, desktop Chrome/Edge/Firefox/Safari).
    // Three layers: no native control bar (see markup), attribute opt-outs,
    // and API interception below. Removing the native controls is what
    // removes the iOS fullscreen and PiP buttons, which are not styleable.
    function exitFullscreenNow() {
      try {
        if (document.fullscreenElement || document.webkitFullscreenElement ||
            document.mozFullScreenElement || document.msFullscreenElement) {
          const fn = document.exitFullscreen || document.webkitExitFullscreen ||
            document.mozCancelFullScreen || document.msExitFullscreen;
          if (fn) fn.call(document);
        }
      } catch { /* ignore */ }
    }
    function exitPipNow() {
      try {
        if (document.pictureInPictureElement && document.exitPictureInPicture) {
          document.exitPictureInPicture().catch(() => {});
        }
      } catch { /* ignore */ }
      try { if (video.webkitSetPresentationMode) video.webkitSetPresentationMode('inline'); } catch { /* ignore */ }
    }
    function neutralize(el, prop, value) {
      try { Object.defineProperty(el, prop, { value, writable: false, configurable: false }); } catch { /* ignore */ }
    }

    // Fullscreen: neutralize every entry point and force-exit if it still happens.
    for (const proto of [Element.prototype, HTMLElement.prototype, HTMLVideoElement.prototype]) {
      if (!proto) continue;
      for (const method of ['requestFullscreen', 'webkitRequestFullscreen', 'webkitRequestFullScreen', 'mozRequestFullScreen', 'msRequestFullscreen']) {
        if (typeof proto[method] === 'function') {
          try {
            proto[method] = function () { exitFullscreenNow(); return Promise.reject(new Error('fullscreen disabled')); };
          } catch { /* ignore */ }
        }
      }
    }
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange']
      .forEach((evt) => document.addEventListener(evt, exitFullscreenNow, true));

    // Picture-in-picture: neutralize the request API and presentation mode,
    // and force inline the moment any engine enters PiP.
    neutralize(video, 'requestPictureInPicture', () => Promise.reject(new Error('picture-in-picture disabled')));
    neutralize(video, 'webkitSetPresentationMode', () => {});
    neutralize(video, 'webkitEnterFullscreen', () => {});
    neutralize(video, 'webkitEnterFullScreen', () => {});
    try { video.disablePictureInPicture = true; } catch { /* ignore */ }
    ['enterpictureinpicture', 'webkitpresentationmodechanged'].forEach((evt) =>
      video.addEventListener(evt, exitPipNow, true));
    document.addEventListener('enterpictureinpicture', exitPipNow, true);
    // Double-click / double-tap must not toggle fullscreen either.
    video.addEventListener('dblclick', (e) => { e.preventDefault(); exitFullscreenNow(); }, true);

    // ── Browser policy: Firefox is not supported ───────────────────────
    // Firefox's picture-in-picture cannot be reliably disabled, so it is
    // blocked. Detection uses Gecko engine features rather than the UA
    // string, so spoofing the user-agent does not get around it. Firefox for
    // iOS runs WebKit and is caught by the FxiOS token as a fallback.
    function isFirefox() {
      try { if (typeof InstallTrigger !== 'undefined') return true; } catch { /* ignore */ }
      try { if ('mozInnerScreenX' in window) return true; } catch { /* ignore */ }
      try { if (typeof navigator.buildID === 'string' && navigator.buildID) return true; } catch { /* ignore */ }
      try { if (document.mozFullScreenEnabled !== undefined) return true; } catch { /* ignore */ }
      try {
        if (window.CSS && CSS.supports &&
            (CSS.supports('-moz-appearance', 'none') || CSS.supports('-moz-user-select', 'none'))) return true;
      } catch { /* ignore */ }
      try { if (/firefox|fxios/i.test(navigator.userAgent || '')) return true; } catch { /* ignore */ }
      return false;
    }

    // ── API helpers ────────────────────────────────────────────────────
    async function postJson(path, body) {
      const res = await fetch(API_BASE + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(body || {}),
      });
      let data = {};
      try { data = await res.json(); } catch { /* ignore */ }
      return { ok: res.ok, status: res.status, data };
    }

    // ── Token refresh loop ─────────────────────────────────────────────
    async function refreshToken() {
      if (destroyed || !currentToken) return;
      const { ok, data } = await postJson('/api/playback/refresh', { token: currentToken });
      if (!ok || !data.token) {
        // Token could not be renewed — surface a soft error but keep the
        // current playback alive until the next attempt.
        console.warn('[player] token refresh failed', data);
        scheduleRefresh(5);
        return;
      }
      currentToken = data.token;
      if (data.watermark && data.watermark !== watermarkText) applyWatermark(data.watermark);
      if (Array.isArray(data.segmentOrigins)) segmentOrigins = data.segmentOrigins;
      if (p2p) p2p.updateToken(currentToken);
      scheduleRefresh(data.refreshIn || 45);
    }

    function scheduleRefresh(seconds) {
      clearTimeout(refreshTimer);
      refreshTimer = setTimeout(refreshToken, Math.max(5, seconds) * 1000);
    }

    // ── HLS playback ───────────────────────────────────────────────────
    function tokenized(url) {
      const u = new URL(url, window.location.href);
      if (currentToken) u.searchParams.set('token', currentToken);
      return u.toString();
    }

    // Minimal LoaderStats object for hls.js when we short-circuit the loader.
    function buildStats(bytes) {
      const now = (window.performance && performance.now()) || Date.now();
      return {
        aborted: false,
        loaded: bytes,
        retry: 0,
        total: bytes,
        chunkCount: 1,
        bwEstimate: 0,
        loading: { start: now, end: now, first: now, finish: now },
        parsing: { start: now, end: now },
        buffering: { start: 0, end: 0, endOffset: 0 },
      };
    }

    // ── Multi-origin load balancing (origin + edge/sub-servers) ────────
    // Builds a weighted, shuffled list of absolute segment URLs to try.
    function segmentCandidates(pathname) {
      const bases = segmentOrigins.length ? segmentOrigins : [{ url: window.location.origin, weight: 1 }];
      const weighted = [];
      for (const o of bases) {
        const w = Math.max(1, Math.min(100, o.weight || 1));
        for (let i = 0; i < w; i += 1) weighted.push(o.url);
      }
      for (let i = weighted.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [weighted[i], weighted[j]] = [weighted[j], weighted[i]];
      }
      const seen = new Set();
      const out = [];
      for (const base of weighted) {
        if (seen.has(base)) continue;
        seen.add(base);
        try {
          const u = new URL(pathname, base);
          if (currentToken) u.searchParams.set('token', currentToken);
          out.push(u.toString());
        } catch { /* skip bad base */ }
      }
      return out;
    }

    // Fetch a segment from the origin/edges (token in the query string, so no
    // cookies are needed and cross-origin edge fetches work with CORS).
    async function fetchFromServer(url) {
      const res = await fetch(url, { credentials: 'omit', mode: 'cors', cache: 'no-store' });
      if (!res.ok) throw new Error('http ' + res.status);
      return res.arrayBuffer();
    }

    // Segment load order: local cache → P2P swarm → load-balanced edges.
    async function loadSegment(segKey, originUrl) {
      let pathname = null;
      try { pathname = new URL(originUrl, window.location.href).pathname; } catch { /* ignore */ }

      if (segKey && p2p) {
        const cached = p2p.cached(segKey);
        if (cached) return cached;

        const fromSwarm = await p2p.getFromSwarm(segKey);
        if (fromSwarm) return fromSwarm;
      }

      if (!pathname) throw new Error('bad segment url');
      let lastErr = null;
      for (const url of segmentCandidates(pathname)) {
        try {
          const buf = await fetchFromServer(url);
          if (segKey && p2p) p2p.store(segKey, buf, 'server');
          return buf;
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr || new Error('segment unavailable');
    }

    function startPlayback(hlsUrl) {
      const isNative = video.canPlayType('application/vnd.apple.mpegurl');

      if (window.Hls && window.Hls.isSupported()) {
        // Custom loader: rewrite every playlist + segment URL to carry the
        // current token. Runs before the XHR is opened, so it is reliable
        // across hls.js versions.
        const BaseLoader = window.Hls.DefaultConfig.loader;
        class TokenLoader extends BaseLoader {
          load(context, config, callbacks) {
            // Media segments: P2P first, then load-balanced origin/edges.
            // Only intercept when there is actually something to gain.
            const useP2POrEdges = (p2p && p2p.enabled) || segmentOrigins.length > 1;
            if (context.type === 'fragment' && useP2POrEdges) {
              const urlWithToken = tokenized(context.url);
              let segKey = null;
              try {
                segKey = new URL(urlWithToken, window.location.href).pathname;
              } catch { /* ignore */ }

              loadSegment(segKey, urlWithToken)
                .then((buf) => {
                  callbacks.onSuccess(
                    { url: urlWithToken, data: buf },
                    buildStats(buf.byteLength),
                    context,
                    null,
                  );
                })
                .catch(() => {
                  super.load(context, config, callbacks);
                });
              return;
            }

            // Playlists and keys: leave context.url intact (the key loader
            // matches on it); xhrSetup appends the token to the request.
            super.load(context, config, callbacks);
          }
        }

        hls = new window.Hls({
          lowLatencyMode: true,
          enableWorker: true,
          backBufferLength: 30,
          maxBufferLength: 6,
          liveSyncDurationCount: 2,
          // hls.js resolves a key request back to its cached entry by
          // context.url, so the loader must never rewrite context.url. Carry
          // the token by re-opening the XHR here instead: xhrSetup runs before
          // hls.js's own open, which then skips it because readyState is set.
          xhrSetup: (xhr, url) => {
            xhr.open('GET', tokenized(url), true);
          },
          loader: TokenLoader,
        });

        hls.on(window.Hls.Events.MANIFEST_PARSED, () => {
          hideOverlay();
          showPlayButton(); // no autoplay — wait for a click
        });

        hls.on(window.Hls.Events.ERROR, (_evt, data) => {
          if (!data || !data.fatal) return;
          // A 403 means the token expired/was rejected. Refresh it and reload
          // the manifest with the new token (startLoad alone won't re-request
          // the manifest, so a 403 on the master playlist would never recover).
          if (data.response && data.response.code === 403) {
            refreshToken().finally(() => {
              if (hls) hls.loadSource(tokenized(sourceUrl || hlsUrl));
            });
            return;
          }
          switch (data.type) {
            case window.Hls.ErrorTypes.NETWORK_ERROR:
              // Retry, but also refresh the token in case it lapsed.
              refreshToken();
              hls.startLoad();
              break;
            case window.Hls.ErrorTypes.MEDIA_ERROR:
              hls.recoverMediaError();
              break;
            default:
              showOverlay('Playback error', 'The stream is unavailable. Retrying…');
              setTimeout(() => window.location.reload(), 5000);
          }
        });

        sourceUrl = hlsUrl;
        hls.loadSource(tokenized(hlsUrl));
        hls.attachMedia(video);
      } else if (isNative) {
        // Safari / iOS: native HLS. The token rides in the playlist URL and
        // in the short-lived ari_play cookie (set by /authorize) so segment
        // requests are also authorized.
        video.src = tokenized(hlsUrl);
        video.addEventListener('loadedmetadata', () => {
          hideOverlay();
          showPlayButton(); // no autoplay — wait for a click
        });
        video.addEventListener('error', () => {
          showOverlay('Playback error', 'This browser could not play the stream.');
        });
      } else {
        showOverlay('Unsupported browser', 'HLS playback is not supported here.');
      }
    }

    // ── Boot ───────────────────────────────────────────────────────────
    async function boot() {
      // Firefox is blocked by engine detection (not UA), so a spoofed
      // user-agent still fails here.
      if (isFirefox()) {
        showOverlay('Browser not supported',
          'Firefox cannot be used for playback. Please use Chrome, Edge, Safari, or Brave.');
        return;
      }

      // Embed-only: refuse direct / top-level access so the player is only
      // usable from an approved site's iframe.
      if (window.self === window.top) {
        showOverlay('Embed only', 'This player can only be used when embedded on an approved site.');
        return;
      }

      if (!STREAM_KEY) {
        showOverlay('No stream specified', 'Add ?key=YOUR_STREAM_KEY to the URL.');
        return;
      }

      const embedHosts = detectEmbedHosts();
      const embedHost = embedHosts[0];

      // 1) Advisory client-side domain check.
      const check = await postJson('/api/playback/check-domain', { host: embedHost, hosts: embedHosts });
      if (check.ok && check.data && check.data.allowed === false) {
        showOverlay('Playback blocked',
          `This domain (${embedHost}) is not whitelisted. Add "${embedHost}" under Whitelist in the dashboard.`);
        return;
      }

      // 2) Authorize: creates a viewer session, generates the watermark and
      //    issues the first short-lived token.
      const auth = await postJson('/api/playback/authorize', { streamKey: STREAM_KEY, embedHost, embedHosts });
      if (!auth.ok) {
        const err = auth.data && auth.data.error;
        console.warn('[player] authorize failed', err, auth.data);
        if (err === 'domain_not_whitelisted') {
          const blocked = (auth.data && auth.data.embedHost) || embedHost;
          showOverlay('Playback blocked',
            `This domain (${blocked}) is not whitelisted. Add "${blocked}" under Whitelist in the dashboard.`);
        } else if (err === 'stream_unavailable') {
          showOverlay('Stream unavailable', 'The stream is offline or disabled.');
        } else {
          showOverlay('Playback error', `Could not authorize playback (${err || auth.status}).`);
        }
        return;
      }

      currentToken = auth.data.token;
      applyWatermark(auth.data.watermark || '');
      if (Array.isArray(auth.data.segmentOrigins)) segmentOrigins = auth.data.segmentOrigins;
      scheduleRefresh(auth.data.refreshIn || 45);
      await initP2P();
      startPlayback(auth.data.hlsUrl);
    }

    // Start the P2P swarm engine (best-effort; never blocks playback).
    async function initP2P() {
      if (!window.AriP2P) return;
      try {
        const res = await fetch('/api/p2p/config', { credentials: 'same-origin' });
        if (!res.ok) return;
        const cfg = await res.json();
        if (!cfg.enabled) return;
        const wsProto = window.location.protocol === 'https:' ? 'wss' : 'ws';
        p2p = new window.AriP2P({
          trackerUrl: `${wsProto}://${window.location.host}${cfg.trackerPath || '/p2p'}`,
          key: STREAM_KEY,
          token: currentToken,
          iceServers: cfg.iceServers || [],
          maxPeers: cfg.maxPeers || 5,
        });
        p2p.connect();
      } catch {
        /* P2P is optional — ignore */
      }
    }

    window.addEventListener('beforeunload', () => {
      destroyed = true;
      clearTimeout(refreshTimer);
      if (p2p) { try { p2p.destroy(); } catch { /* ignore */ } }
      if (hls) { try { hls.destroy(); } catch { /* ignore */ } }
    });

    boot();
  </script>
</body>
</html>
